name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sdcc \
            gcc-i686-linux-gnu binutils-i686-linux-gnu \
            qemu-system-x86 qemu-system-data seabios \
            grub-pc-bin grub-common xorriso mtools \
            python3 make gcc
          sdcc --version | head -1
          i686-linux-gnu-gcc --version | head -1
          qemu-system-i386 --version | head -1
          grub-mkrescue --version

      - name: Build the native Z80 system (SDCC)
        run: make z80

      - name: Build the bare-metal i386 kernel
        run: |
          make i386 I386CC=i686-linux-gnu-gcc I386AS=i686-linux-gnu-as
          make check-i386 I386OBJDUMP=i686-linux-gnu-objdump
          readelf -h -l build/i386/kernel.elf

      - name: Build the boot ISO and system disk image
        run: |
          make iso
          make fsimage

      - name: Boot smoke test (prints QEMU diagnostics on failure)
        run: |
          python3 tools/mkdisk.py 0 build/smoke-a.img
          printf 'dir\n' > build/smoke.in
          python3 tools/mkimage.py -o build/smoke.img -A build/smoke-a.img -s build/smoke.in
          set +e
          timeout 60 qemu-system-i386 -display none -monitor none -no-reboot -m 16 \
            -kernel build/i386/kernel.elf \
            -drive file=build/smoke.img,format=raw,if=ide \
            -chardev stdio,id=c0 -serial chardev:c0 \
            -serial file:build/smoke.list -serial file:build/smoke.diag \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            </dev/null | od -c | head -5
          echo "qemu status ${PIPESTATUS[0]} (65 = clean exit)"
          cat build/smoke.diag

      - name: Build the test host and reference binaries
        run: make build/cpm build/ref/ccp.bin build/ref/bdos.bin

      - name: Differential tests (original asm vs hosted, Z80, i386/QEMU)
        run: python3 tests/run_tests.py

      - name: Extra fuzzing
        run: python3 tests/run_tests.py -k fuzz --fuzz-seeds 60

      - uses: actions/upload-artifact@v7
        with:
          name: cpm22-c
          path: |
            build/z80/cpm.bin
            build/i386/kernel.elf
            build/cpm.iso
            build/disks/system.img
            build/ref/ccp.bin
            build/ref/bdos.bin

  build-and-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchains
        run: |
          brew install sdcc i686-elf-gcc qemu i686-elf-grub xorriso
          sdcc --version | head -1
          i686-elf-gcc --version | head -1
          qemu-system-i386 --version | head -1
          i686-elf-grub-mkrescue --version

      - name: Build everything (hosted, Z80, i386)
        run: |
          make
          make check-i386

      - name: Build the boot ISO and system disk image
        run: |
          make iso GRUBMKRESCUE=i686-elf-grub-mkrescue
          make fsimage

      - name: Differential tests (original asm vs hosted, Z80, i386/QEMU)
        run: python3 tests/run_tests.py

      - name: Extra fuzzing
        run: python3 tests/run_tests.py -k fuzz --fuzz-seeds 30

      - uses: actions/upload-artifact@v7
        with:
          name: cpm22-c-macos
          path: |
            build/z80/cpm.bin
            build/i386/kernel.elf
            build/cpm.iso
            build/disks/system.img
            build/ref/ccp.bin
            build/ref/bdos.bin

  release:
    needs: [build-and-test, build-and-test-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: cpm22-c
          path: artifacts/linux

      - uses: actions/download-artifact@v7
        with:
          name: cpm22-c-macos
          path: artifacts/macos

      - name: Zip all build artifacts
        id: zip
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cd artifacts
          zip -r "../cpm22-c-${tag}.zip" .

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.zip.outputs.tag }}
        run: |
          gh release create "$TAG" "cpm22-c-${TAG}.zip" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
